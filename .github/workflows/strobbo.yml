name: Strobbo sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node strobbo-sync.mjs
        env:
          STROBBO_URL: ${{ secrets.STROBBO_URL }}
